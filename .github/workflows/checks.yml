name: README Check

on: push

jobs:
  check-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: README exists and not empty
        run: test -s README.md

  count-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Count files
        run: |
          count=$(ls | wc -l)
          echo "There are $count files in the repo"

  no-secret-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fail if a secret file exists
        run: |
          if ls | grep -q secret; then
            echo "Found a file with 'secret' in its name!"
            exit 1
          fi
